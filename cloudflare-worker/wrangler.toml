name = "avero-media-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (non-secret)
[vars]
B2_BUCKET_NAME = "avero-media"
B2_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"

# Secrets are set via `wrangler secret put`:
# B2_KEY_ID
# B2_APPLICATION_KEY
# MEDIA_WORKER_TOKEN_KEY (shared with media-storage Edge Function)

# Observability
[observability]
enabled = true