<script>
        (function() {
            // Theme Toggle Logic
            const themeToggle = document.getElementById('theme-toggle');
            const htmlElement = document.documentElement;
            
            function setTheme(theme) {
                if (theme === 'dark') {
                    htmlElement.classList.add('dark');
                    htmlElement.classList.remove('light');
                    localStorage.setItem('theme', 'dark');
                } else {
                    htmlElement.classList.remove('dark');
                    htmlElement.classList.add('light');
                    localStorage.setItem('theme', 'light');
                }
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const isDark = htmlElement.classList.contains('dark');
                    setTheme(isDark ? 'light' : 'dark');
                });
            }
            
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                setTheme('dark');
            } else {
                setTheme('light');
            }

            // Custom Select Logic
            const selectBtn = document.getElementById('custom-select-btn');
            const selectMenu = document.getElementById('custom-select-menu');
            const selectLabel = document.getElementById('custom-select-label');
            const hiddenSelect = document.getElementById('memory-type-select');
            const options = document.querySelectorAll('.custom-option');

            if (selectBtn && selectMenu) {
                selectBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectMenu.classList.toggle('open');
                    selectBtn.classList.toggle('border-b-2');
                    selectBtn.classList.toggle('border-accent-warm');
                    selectBtn.classList.toggle('dark:border-accent-dark');
                });

                options.forEach(option => {
                    option.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const value = option.getAttribute('data-value');
                        const text = option.textContent;
                        
                        // Update UI
                        selectLabel.textContent = text;
                        selectLabel.classList.remove('text-on-surface-variant', 'dark:text-secondary-fixed-dim');
                        selectLabel.classList.add('text-on-surface', 'dark:text-white');
                        
                        // Update hidden select
                        hiddenSelect.value = value;
                        
                        // Close menu
                        selectMenu.classList.remove('open');
                        selectBtn.classList.remove('border-b-2', 'border-accent-warm', 'dark:border-accent-dark');
                    });
                });

                // Close when clicking outside
                document.addEventListener('click', () => {
                    selectMenu.classList.remove('open');
                    selectBtn.classList.remove('border-b-2', 'border-accent-warm', 'dark:border-accent-dark');
                });
            }
        })();
    </script>
