<script>
        const htmlElement = document.documentElement;
        const globalToggle = document.getElementById('global-theme-toggle');
        const lightBtn = document.getElementById('theme-light-btn');
        const darkBtn = document.getElementById('theme-dark-btn');
        
        function setTheme(theme) {
            if (theme === 'dark') {
                htmlElement.classList.add('dark');
                htmlElement.classList.remove('light');
                
                // Update toggle buttons
                darkBtn.className = 'px-6 py-2 rounded-DEFAULT text-sm font-medium transition-colors w-24 flex items-center justify-center gap-2 bg-[#2a2c2c] text-white shadow-sm border border-white/10';
                lightBtn.className = 'px-6 py-2 rounded-DEFAULT text-sm font-medium transition-colors w-24 flex items-center justify-center gap-2 text-on-surface-variant dark:text-on-surface-variant/70 hover:text-on-surface dark:hover:text-inverse-on-surface';
                
            } else {
                htmlElement.classList.add('light');
                htmlElement.classList.remove('dark');
                
                // Update toggle buttons
                lightBtn.className = 'px-6 py-2 rounded-DEFAULT text-sm font-medium transition-colors w-24 flex items-center justify-center gap-2 bg-accent-warm text-white shadow-sm';
                darkBtn.className = 'px-6 py-2 rounded-DEFAULT text-sm font-medium transition-colors w-24 flex items-center justify-center gap-2 text-on-surface-variant dark:text-on-surface-variant/70 hover:text-on-surface dark:hover:text-inverse-on-surface';
                
            }
        }

        globalToggle.addEventListener('click', () => {
            const isDark = htmlElement.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        });

        // Initialize based on current class
        if (htmlElement.classList.contains('dark')) {
            setTheme('dark');
        } else {
            setTheme('light');
        }
    </script>
