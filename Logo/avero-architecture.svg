<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Avero architecture</title>
  <desc id="desc">Avero's React frontend connects to Supabase Auth, PostgreSQL, and Edge Functions. Media operations flow through a Cloudflare Worker to Backblaze B2 storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17251f"/>
      <stop offset="1" stop-color="#243c32"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#456b56"/>
      <stop offset="1" stop-color="#345445"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d49b78"/>
      <stop offset="1" stop-color="#b87955"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#09130f" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9c5ae"/>
    </marker>
    <marker id="arrowClay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d49b78"/>
    </marker>
    <style>
      .heading{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:700;fill:#f8f4ec}
      .sub{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:400;fill:#c6d7cb}
      .nodeTitle{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:650;font-size:21px;fill:#f8f4ec}
      .nodeSub{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:400;font-size:14px;fill:#d6e2d8}
      .pill{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:600;font-size:12px;letter-spacing:1.2px;fill:#f8f4ec}
      .linkLabel{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:500;font-size:13px;fill:#c6d7cb}
    </style>
  </defs>
  <rect width="1200" height="700" rx="30" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="155" fill="#6f927c" opacity=".08"/>
  <circle cx="105" cy="615" r="190" fill="#c78a65" opacity=".07"/>
  <path d="M48 130 H1152" stroke="#6f927c" stroke-opacity=".35"/>
  <text x="60" y="66" class="pill" fill="#a9c5ae">UNDER THE HOOD</text>
  <text x="60" y="105" class="heading" font-size="34">Avero, connected.</text>
  <text x="1140" y="91" class="sub" font-size="14" text-anchor="end">From shared moments to safely stored media</text>

  <!-- Main app -->
  <g filter="url(#shadow)">
    <rect x="60" y="200" width="330" height="168" rx="20" fill="url(#green)" stroke="#7ba087" stroke-opacity=".7"/>
    <rect x="84" y="224" width="42" height="42" rx="12" fill="#f8f4ec" fill-opacity=".12"/>
    <path d="M95 245 l8 -8 8 8 -8 8z" fill="#f8f4ec"/>
    <text x="144" y="245" class="nodeTitle">Avero web app</text>
    <text x="84" y="294" class="nodeSub">React 19 · TypeScript · Vite</text>
    <text x="84" y="319" class="nodeSub">Spaces, Memories, maps &amp; media</text>
    <rect x="84" y="337" width="102" height="20" rx="10" fill="#f8f4ec" fill-opacity=".13"/>
    <text x="135" y="351" class="pill" text-anchor="middle" font-size="10">CLIENT</text>
  </g>

  <!-- Supabase grouping -->
  <rect x="475" y="170" width="340" height="275" rx="24" fill="#213b30" stroke="#6f927c" stroke-opacity=".65" stroke-dasharray="6 7"/>
  <text x="500" y="201" class="pill" fill="#a9c5ae">SUPABASE</text>
  <g filter="url(#shadow)">
    <rect x="500" y="220" width="290" height="58" rx="14" fill="#2f5946" stroke="#6f927c" stroke-opacity=".7"/>
    <circle cx="526" cy="249" r="10" fill="#a9c5ae"/>
    <path d="M521 249 h10 M526 244 v10" stroke="#243c32" stroke-width="2" stroke-linecap="round"/>
    <text x="549" y="246" class="nodeTitle" font-size="18">Supabase Auth</text>
    <text x="549" y="264" class="nodeSub" font-size="12">User identity &amp; sessions</text>
    <rect x="500" y="294" width="290" height="58" rx="14" fill="#2f5946" stroke="#6f927c" stroke-opacity=".7"/>
    <ellipse cx="526" cy="313" rx="10" ry="4" fill="#a9c5ae"/>
    <path d="M516 313 v16 c0 5 20 5 20 0 v-16 M516 321 c0 5 20 5 20 0" stroke="#a9c5ae" fill="none" stroke-width="2"/>
    <text x="549" y="320" class="nodeTitle" font-size="18">PostgreSQL</text>
    <text x="549" y="338" class="nodeSub" font-size="12">Memories, Spaces &amp; memberships</text>
    <rect x="500" y="368" width="290" height="58" rx="14" fill="#2f5946" stroke="#6f927c" stroke-opacity=".7"/>
    <path d="M517 388 h18 M517 394 h18 M517 400 h12" stroke="#a9c5ae" stroke-width="2" stroke-linecap="round"/>
    <text x="549" y="393" class="nodeTitle" font-size="18">Edge Functions</text>
    <text x="549" y="411" class="nodeSub" font-size="12">Authenticated media operations</text>
  </g>

  <!-- Cloudflare + B2 -->
  <g filter="url(#shadow)">
    <rect x="900" y="220" width="240" height="95" rx="18" fill="#493b30" stroke="#d49b78" stroke-opacity=".9"/>
    <rect x="922" y="242" width="38" height="38" rx="11" fill="url(#clay)"/>
    <path d="M931 262 c-1-8 5-13 12-12 5 0 9 4 9 9 4 1 6 5 4 9 h-24 c-4-1-5-5-1-6z" fill="#fff4e9" fill-opacity=".95"/>
    <text x="974" y="254" class="nodeTitle" font-size="18">Cloudflare Worker</text>
    <text x="974" y="276" class="nodeSub" font-size="12">Media delivery proxy</text>
    <rect x="900" y="390" width="240" height="95" rx="18" fill="#493b30" stroke="#d49b78" stroke-opacity=".9"/>
    <rect x="922" y="412" width="38" height="38" rx="11" fill="#d49b78" fill-opacity=".25"/>
    <path d="M931 423 h20 v17 h-20z M935 419 h12 M935 444 h12" stroke="#f8dcc7" fill="none" stroke-width="2" stroke-linejoin="round"/>
    <text x="974" y="424" class="nodeTitle" font-size="18">Backblaze B2</text>
    <text x="974" y="446" class="nodeSub" font-size="12">Private object storage</text>
  </g>

  <!-- Connections -->
  <path d="M390 246 H448 V249 H493" stroke="#a9c5ae" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 284 H430 V323 H493" stroke="#a9c5ae" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 330 H448 V397 H493" stroke="#a9c5ae" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M790 397 H845 V268 H892" stroke="#d49b78" stroke-width="2.5" fill="none" marker-end="url(#arrowClay)"/>
  <path d="M1020 315 V382" stroke="#d49b78" stroke-width="2.5" fill="none" marker-end="url(#arrowClay)"/>
  <text x="415" y="230" class="linkLabel">Auth</text>
  <text x="413" y="306" class="linkLabel">Data</text>
  <text x="405" y="367" class="linkLabel">Media API</text>
  <text x="856" y="326" class="linkLabel" transform="rotate(-90 856 326)" text-anchor="middle">Signed / authorized media flow</text>
  <text x="1034" y="354" class="linkLabel">Object access</text>

  <!-- Security note -->
  <rect x="60" y="545" width="1080" height="93" rx="18" fill="#17251f" stroke="#6f927c" stroke-opacity=".45"/>
  <circle cx="91" cy="578" r="12" fill="#6f927c"/>
  <path d="M91 570 l7 3 v6 c0 5-4 8-7 10-4-2-7-5-7-10 v-6z" fill="#f8f4ec"/>
  <text x="118" y="576" class="nodeTitle" font-size="17">Keep secrets on the server.</text>
  <text x="118" y="601" class="nodeSub" font-size="14">Browser uses public client configuration; storage credentials and privileged keys belong in server-side secrets.</text>
  <text x="60" y="672" class="sub" font-size="12">AVERO  ·  PRIVATE BY DESIGN  ·  ARCHITECTURE AT A GLANCE</text>
  <text x="1140" y="672" class="sub" font-size="12" text-anchor="end">UI  →  DATA  →  MEDIA</text>
</svg>
